# GL.iNet nginx location — NetBird UI at http://192.168.8.1/netbird/
# Deploy to: /etc/nginx/gl-conf.d/netbird.conf

location = /netbird {
    return 302 /netbird/;
}

# Static SPA served directly by nginx — requires a signed-in GL.iNet admin session
location = /netbird/ {
    access_by_lua_file /usr/share/gl-ngx/netbird-access.lua;
    root /www;
    try_files /netbird/index.html =404;
    add_header Cache-Control "no-cache, no-store";
}

# JSON API — shell CGI run by GL.iNet's fcgiwrap, kept outside /www so /cgi-bin/ cannot reach it unauthenticated
location = /netbird/api {
    access_by_lua_file /usr/share/gl-ngx/netbird-access.lua;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/libexec/netbird-api.cgi;
    fastcgi_read_timeout 60;
    fastcgi_pass unix:/var/run/fcgiwrap.socket;
}
